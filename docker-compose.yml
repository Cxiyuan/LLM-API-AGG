# Deployment compose file.
#
# The image is built by GitHub Actions and pushed to GHCR. This file does not
# build locally. Set FREE_LLM_API_IMAGE in .env, for example:
#
#   FREE_LLM_API_IMAGE=ghcr.io/your-user/llm-api-agg:latest
#
# Then:
#
#   docker compose pull
#   docker compose up -d
#   docker compose exec app workbuddy-login --realm cn
#
# The console is published on :80; the OpenAI-compatible model API remains on
# :8788. The Buddy2api debug gateway stays loopback-only on :8787.
# On a remote server, use an SSH tunnel:
#
#   ssh -L 8787:127.0.0.1:8787 -L 8788:127.0.0.1:8788 -L 80:127.0.0.1:80 user@server

services:
  app:
    image: ${FREE_LLM_API_IMAGE:?Set FREE_LLM_API_IMAGE to the GHCR image built by CI}
    container_name: llm-api-agg
    init: true
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:8787:8787"   # Buddy2api: WorkBuddy login + /v1 gateway
      - "80:8790"               # Hono + htmx console
      - "8788:8788"             # Unified model API (unchanged)
    volumes:
      - ./data:/data
    environment:
      CB_GATEWAY_ADMIN_TOKEN: ${CB_GATEWAY_ADMIN_TOKEN:-}
      CB_GATEWAY_MASTER_KEY: ${CB_GATEWAY_MASTER_KEY:-}
      # 允许 Buddy2api 加载的多渠道；没有导入账号的通道会自动跳过。
      CB_GATEWAY_PROVIDERS: ${CB_GATEWAY_PROVIDERS:-workbuddy,workbuddy-i,qoder,qoder-i,qwenwork,traework}
      WORKBUDDY_PROVIDERS: ${WORKBUDDY_PROVIDERS:-workbuddy,workbuddy-i,qoder,qoder-i,qwenwork,traework}
      # Optional standalone OpenBridge channel. Leave empty to disable.
      OPENBRIDGE_URL: ${OPENBRIDGE_URL:-}
      OPENBRIDGE_API_KEY: ${OPENBRIDGE_API_KEY:-}
      OPENBRIDGE_MODELS: ${OPENBRIDGE_MODELS:-}
      OPENBRIDGE_SUPPORTS_TOOL_CALL: ${OPENBRIDGE_SUPPORTS_TOOL_CALL:-true}
      OPENBRIDGE_SUPPORTS_REASONING: ${OPENBRIDGE_SUPPORTS_REASONING:-true}
      OPENBRIDGE_SUPPORTS_IMAGES: ${OPENBRIDGE_SUPPORTS_IMAGES:-false}
      OPENBRIDGE_CONTEXT_WINDOW: ${OPENBRIDGE_CONTEXT_WINDOW:-128000}
      OPENBRIDGE_MAX_OUTPUT: ${OPENBRIDGE_MAX_OUTPUT:-16384}
      CATALOGWATCH_ADMIN_USER: ${CATALOGWATCH_ADMIN_USER:-admin}
      CATALOGWATCH_ADMIN_PASSWORD: ${CATALOGWATCH_ADMIN_PASSWORD:-admin}
      CATALOGWATCH_ADMIN_TOKEN: ${CATALOGWATCH_ADMIN_TOKEN:-}
      CATALOGWATCH_KEY_PEPPER: ${CATALOGWATCH_KEY_PEPPER:-}
      TZ: ${TZ:-Asia/Shanghai}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/deploy/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
