[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:buddy2api]
command=/opt/venv/bin/python server.py --host 0.0.0.0 --port 8787 --no-browser --log-level info
directory=/opt/buddy2api
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/buddy2api.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/buddy2api.err
stderr_logfile_maxbytes=0

[program:catalogwatch]
command=/opt/venv/bin/python /app/deploy/start_catalogwatch.py
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/catalogwatch.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/catalogwatch.err
stderr_logfile_maxbytes=0

[program:ui]
command=/usr/local/bin/node /opt/ui/server.js
directory=/opt/ui
environment=API_ORIGIN="http://127.0.0.1:8788",UI_PORT="8790",APP_VERSION="%(ENV_APP_VERSION)s"
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/ui.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/ui.err
stderr_logfile_maxbytes=0
