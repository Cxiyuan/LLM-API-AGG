[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:buddy2api]
command=/opt/venv/bin/python server.py --host 0.0.0.0 --port 8787 --no-browser --log-level info
directory=/opt/buddy2api
autostart=true
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/buddy2api.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/buddy2api.err
stderr_logfile_maxbytes=0

[program:catalogwatch]
command=/opt/venv/bin/python /app/deploy/start_catalogwatch.py
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/catalogwatch.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/catalogwatch.err
stderr_logfile_maxbytes=0
