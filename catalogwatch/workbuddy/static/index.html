<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkBuddy Pool</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">WorkBuddy Pool</div>
    <nav id="nav" hidden>
      <button data-view="overview">总览</button>
      <button data-view="accounts">账号</button>
      <button data-view="models">模型与倍率</button>
      <button data-view="checkin">签到</button>
      <button data-view="keys">池 Key</button>
      <button data-view="requests">请求账本</button>
      <button data-view="policy">调度策略</button>
      <button data-view="settings">设置</button>
      <button data-view="audit">审计</button>
    </nav>
    <div class="spacer"></div>
    <button id="logout" hidden>退出</button>
  </header>

  <main>
    <section id="login" class="card narrow">
      <h1>登录控制台</h1>
      <p class="muted">使用容器生成的 <code>CATALOGWATCH_ADMIN_TOKEN</code>（/data/secrets/catalogwatch_admin_token）。</p>
      <form id="login-form">
        <input id="login-token" type="password" autocomplete="current-password" placeholder="Admin token" required>
        <button type="submit">登录</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="app" hidden>
      <div id="view"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
