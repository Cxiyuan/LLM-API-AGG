<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM-API-AGG · WorkBuddy 池</title>
  <link rel="stylesheet" href="/static/style.css?v=0.2.4">
</head>
<body>
  <header>
    <div class="brand">LLM-API-AGG · WorkBuddy 池</div>
    <nav id="nav" hidden>
      <button data-view="overview">总览</button>
      <button data-view="accounts">WorkBuddy 账号</button>
      <button data-view="models">模型与倍率</button>
      <button data-view="checkin">自动签到</button>
      <button data-view="keys">池 Key</button>
      <button data-view="requests">请求账本</button>
      <button data-view="policy">调度策略</button>
      <button data-view="settings">设置</button>
      <button data-view="audit">审计</button>
    </nav>
    <div class="spacer"></div>
    <button id="logout" hidden>退出</button>
  </header>

  <main>
    <section id="login" class="card narrow">
      <h1>登录控制台</h1>
      <p class="muted">默认账号 <code>admin</code> / 密码 <code>admin</code>；可用环境变量 <code>CATALOGWATCH_ADMIN_USER</code> / <code>CATALOGWATCH_ADMIN_PASSWORD</code> 覆盖。</p>
      <form id="login-form">
        <input id="login-username" type="text" autocomplete="username" placeholder="账号" value="admin" required>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="密码" required>
        <button type="submit">登录</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="app" hidden>
      <div id="view"></div>
    </section>
  </main>

  <script src="/static/app.js?v=0.2.4"></script>
</body>
</html>
